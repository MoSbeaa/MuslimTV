plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.muslimtv.screensaver'
    compileSdk 34
    aaptOptions { noCompress "mp3", "json" }

    defaultConfig {
        applicationId 'sa.muslimtv.screensaver'
        minSdk 21
        targetSdk 34
        // CI passes its run number so every build installs over the previous one; 3.x since the new signing key,
        // the same number as the home app and as the release (v3.N)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "3.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        // the branch the page, fonts and photos are fetched from: CI passes the one it builds, a local build follows master
        buildConfigField "String", "BRANCH", "\"${System.getenv('MUSLIMTV_BRANCH') ?: 'main'}\""
    }

    buildFeatures {
        buildConfig true   // off by default since AGP 8
    }

    signingConfigs {
        // the key lives only in the repository's secrets (made with .github/tools/make_signing_key.py) and CI refuses
        // to build without it; a local build without ANDROID_KEYSTORE gets the debug key, so it can't update the TV's apps
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'muslimtv'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    // the page is built by ../../src/build.py into dist/
    sourceSets {
        main { assets.srcDirs = ['src/main/assets', "$buildDir/generated/web", '../launcher/src/main/assets' , '../../assets', "$buildDir/generated/localphotos"] }   // page, Thmanyah fonts, backgrounds/, shared/ (the club lists)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Keep the user-selected photo set in the APK, independent of upstream GitHub.
def copyPersonalPhotos = tasks.register('copyPersonalPhotos', Sync) {
    from('../../photos') { include 'index.json'; include 'tv/*.jpg'; into 'photos' }
    into "$buildDir/generated/localphotos"
}
preBuild.dependsOn copyPersonalPhotos

def copyTvPage = tasks.register('copyTvPage', Sync) {
    from('../../dist') { include 'tv.html' }
    into "$buildDir/generated/web"
}
preBuild.dependsOn copyTvPage
