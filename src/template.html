<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MuslimTV Screensaver</title>
<style>
  @font-face{font-family:'Thmanyah';font-weight:300;font-style:normal;font-display:block;src:url("__F_LIGHT__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:400;font-style:normal;font-display:block;src:url("__F_REGULAR__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:500;font-style:normal;font-display:block;src:url("__F_MEDIUM__") format("woff2")}
  /* ﷺ and ﴿﴾ only (2 KB subset of Noto Naskh Arabic, OFL): Thmanyah has no glyph for them */
  @font-face{font-family:'NotoMarks';font-style:normal;font-weight:400;src:url("__F_MARKS__") format("woff2")}
  @font-face{font-family:'ThmanyahDisplay';font-weight:700;font-style:normal;font-display:block;src:url("__F_DISPLAY__") format("woff2")}

  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --surface-rgb:16,45,33;
    --accent-rgb:220,184,111;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .top,html.widget .clockwrap,html.widget .prayer-strip,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  html.widget .mid{display:block}
  html.widget .week{width:100%}
  html,body{
    height:100%;overflow:hidden;background:#000;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#000;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    opacity:0;transition:opacity 1.2s ease-in-out;will-change:opacity;
  }
  .photo.current{opacity:1}
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  /* Two photo layers: each image is set only while its layer is invisible. */
  .veil{
    position:fixed;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(0,0,0,.70) 0%,rgba(0,0,0,.25) 25%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.90) 100%);
  }
  /* photo credits live in PHOTO-CREDITS.md on GitHub, not on screen */
  #credit{display:none;
    position:fixed;left:26px;bottom:6px;z-index:4;
    font-size:10px;letter-spacing:.02em;
    color:rgba(246,239,224,.30);pointer-events:none;
  }
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil,.bottom-veil{display:none}

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);justify-self:end;
    background:rgba(var(--surface-rgb),.55);   /* same surface and stroke as the launcher favourites band */
    border:1px solid rgba(var(--accent-rgb),.30);
    border-radius:26px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:clamp(12px,1vw,18px);font-weight:500;letter-spacing:.18em;color:var(--gold);
  }
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--accent-rgb),.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:clamp(14px,1.16vw,22px);font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(var(--accent-rgb),.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:var(--gold);font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .week li.past{color:#8F8670}
  .week li.next{color:var(--gold)}
  .week li.next .dt{color:var(--gold)}
  .week li.quote{white-space:normal;display:block;font-size:clamp(17px,1.5vw,29px);line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:var(--gold);
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:var(--gold);font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:clamp(15px,1.3vw,25px);line-height:1.7}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:clamp(12px,.95vw,18px);color:var(--gold)}
  .week .empty{color:#9A9078;font-size:clamp(14px,1.1vw,21px);font-weight:300;margin-top:1vh}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(var(--accent-rgb),0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4.5vw}
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;
  }
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;
    font-size:clamp(12px,1.02vw,20px);font-weight:300;letter-spacing:.3em;color:#D8CDB6;
  }
  .subline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}

  .prayer-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1vw;direction:rtl}
  .prayer-card{
    min-width:0;padding:.8vh .95vw;text-align:center;
    background:rgba(var(--surface-rgb),.55);border:1px solid rgba(var(--accent-rgb),.30);border-radius:26px;
  }
  .prayer-card .name{display:block;color:var(--gold);font-size:clamp(12px,.96vw,18px);font-weight:500}
  .prayer-card .time{display:block;margin-top:.15vh;color:var(--sand);font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-size:clamp(16px,1.35vw,25px);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .prayer-card.next{border-color:rgba(var(--accent-rgb),.60);background:rgba(var(--surface-rgb),.82)}
  .prayer-card.next .time{color:var(--gold)}

  .bottom{
    display:grid;grid-template-columns:1fr .9fr 1.3fr;
    gap:2.4vw;align-items:start;
    border-top:1px solid rgba(var(--accent-rgb),.30);
    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:.2em;
    color:var(--gold);margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}

  .p-prayer{text-align:right}
  .p-prayer .big{justify-content:flex-start}
  .p-mid{text-align:center}
  .p-mid .big{display:block;text-align:center;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .unit,.p-countdown .unit{font-size:.46em;font-weight:500;color:var(--gold);letter-spacing:.02em;display:inline;vertical-align:.5em}
  .p-countdown{text-align:left}
  .p-countdown .big{justify-content:flex-end}
  .p-countdown .sub{white-space:normal;line-height:1.4;max-width:100%;font-size:clamp(11px,.88vw,17px)}


  /* ===== top left: weather, set like the date block on the right (no boxes) ===== */
  .weather{text-align:left;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(var(--accent-rgb),.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(var(--accent-rgb),0))}
  .p-prayer.now .big{color:var(--gold);text-shadow:0 0 40px rgba(var(--accent-rgb),.45)}
  .p-prayer.now .label{color:var(--gold)}
  .dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity 6s linear}
  .stage{transition:transform 3s ease}
  .sc{color:var(--gold);letter-spacing:.02em}

  @media (max-aspect-ratio:5/4){
    .top{flex-direction:column-reverse;gap:1.4vh}
    .bottom{grid-template-columns:1fr 1fr}
    .p-countdown{grid-column:1/-1;text-align:right}
  }
</style>
</head>
<body>
<div class="photo current"></div>
<div class="photo"></div>
<div id="credit"></div>
<div class="veil"></div>
<div class="grain"></div>
<div class="top-veil"></div>
<div class="bottom-veil"></div>
<div class="dimmer" id="dimmer"></div>

<main class="stage">

  <header class="top">
    <div class="dates">
      <div class="hijri" id="hijri">—</div>
      <div class="greg" id="greg">—</div>
      <div class="rule"></div>
    </div>

    <div class="weather">
      <div class="wxline"><span class="wxt" id="wx-temp"></span><span class="wxd" id="wx-desc"></span></div>
      <div class="wxsub"><span id="wx-city">الرياض</span><span class="wxr" id="wx-range"></span></div>
    </div>
  </header>

  <section class="mid">
    <div class="clockwrap">
      <div class="clock">
        <span class="ampm" id="ck-ap">—</span><span class="d" id="ck-h">--</span><span class="sep">:</span><span class="d" id="ck-m">--</span>
      </div>
      <div class="subline"><span class="dot"></span><span id="clock-sub">بتوقيت الرياض</span></div>
    </div>

    <div class="week">
      <div class="hd" id="week-hd">هذا الأسبوع</div>
      <ul id="week-list"><li class="empty">جارٍ التحميل…</li></ul>
    </div>
  </section>

  <section class="prayer-strip" id="prayer-strip" aria-label="مواقيت الصلاة اليوم"></section>

  <footer class="bottom">
    <div class="panel p-prayer">
      <div class="label" id="prayer-label">الصلاة القادمة</div>
      <div class="big"><span id="prayer-name">—</span><span class="num" id="prayer-time"></span></div>
      <div class="sub" id="prayer-count">—</div>
    </div>

    <div class="panel p-mid">
      <div class="label" id="ramadan-label">رمضان ١٤٤٨</div>
      <div class="big"><span class="num" id="ramadan-days">—</span></div>
      <div class="sub" id="ramadan-sub">—</div>
    </div>

    <div class="panel p-countdown" hidden>
      <div class="label" id="countdown-label">العد التنازلي</div>
      <div class="big"><span class="num" id="countdown-days">—</span><span class="unit">يوم</span></div>
      <div class="sub" id="countdown-sub">—</div>
    </div>
  </footer>

</main>

<script>
// daily background: one photo per Riyadh day, deterministic
const BGS = [
__BG_SET__
];
// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _list = k => (_Q.get(k) || '').split(',').map(x=>x.trim()).filter(Boolean);
const _num = (k, d) => { const v = parseFloat(_Q.get(k)); return isNaN(v) ? d : v; };
const CONFIG = {
  city: ((name) => /^winnipeg$/i.test(name) || name === 'وينيبغ' ? 'وينبيغ' : name)(_Q.get('city') || 'وينبيغ'),
  latitude: _num('lat', 24.7136),
  longitude: _num('lon', 46.6753),
  timezone: _Q.get('tz') || 'America/Winnipeg',
  prayerMethod: 4,
  asrMithl: _num('asr', 2),
  // the card beside the clock: shows | prayers | forecast | verse | none
  panel: (p => ['shows','prayers','forecast','verse','none'].includes(p) ? p : 'verse')
         (_Q.get('panel') || (_Q.get('week') === '0' ? 'none' : 'verse')),
  // minutes from adhan to iqama (Ministry of Islamic Affairs defaults); Friday Dhuhr has none
  iqama: {Fajr:25, Dhuhr:20, Asr:20, Maghrib:10, Isha:20},
  // "new this week" filters from the app: TVMaze genres, languages, countries, picked show ids
  shows: {
    genres: _list('genres'),
    langs: _list('langs'),
    ids: _list('shows').filter(x=>/^\d+$/.test(x)).slice(0, 30),
    countries: _list('countries').length ? _list('countries') : ['US'],
    minRating: _num('minrating', 7),
  },
  weekWindowDays: 7,
  // minutes between background photos: #photos=5|10|15|30|60 (anything else = 30)
  photoMinutes: (m => [5,10,15,30,60].includes(m) ? m : 30)(_num('photos', 30)),
  // #widget=1: only the card, on a transparent page (the launcher's home screen shows it)
  widget: _Q.get('widget') === '1',
  eventTitle: _Q.get('event_title') || 'العد التنازلي',
  eventDate: _Q.get('event_date') || '',
};
function applyTheme(){
  const rgb = (key, fallback) => {
    const hex = _Q.get(key) || fallback;
    const valid = /^[0-9a-fA-F]{6}$/.test(hex) ? hex : fallback;
    return [0,2,4].map(i => parseInt(valid.slice(i,i+2),16));
  };
  const surface = rgb('surface', '102D21'), accent = rgb('accent', 'DCB86F');
  const style = document.documentElement.style;
  style.setProperty('--surface-rgb', surface.join(','));
  style.setProperty('--accent-rgb', accent.join(','));
  style.setProperty('--gold', `rgb(${accent.join(',')})`);
}
applyTheme();

const GREG = 'ar-SA-u-ca-gregory-nu-arab';
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

function riyadhParts(d = new Date()){
  const f = new Intl.DateTimeFormat('en-GB',{
    timeZone: CONFIG.timezone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
function fmt12(h, mi){
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(h12)}:${ar(pad(mi))} ${h < 12 ? 'ص' : 'م'}`;
}

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(h12));
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  document.getElementById('ck-ap').textContent = p.h < 12 ? 'ص' : 'م';
}

function tickDates(){
  const now = new Date();
  try{
    let h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
    h = h.replace(/\s*هـ\s*$/,'').replace(/،\s*$/,'');
    document.getElementById('hijri').textContent = h + ' هـ';
  }catch(e){}
  try{
    document.getElementById('greg').textContent = new Intl.DateTimeFormat(GREG,{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
  }catch(e){}
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(t){
  DAY_TIMES = t;
  PRAYERS = PRAYER_KEYS.map(k=>{
    const [h,mi] = String(t[k]).split(':').map(Number);
    return {key:k, name:PRAYER_NAMES[k], h, mi};
  });
  renderPrayerStrip();
}

function renderPrayerStrip(){
  const strip = document.getElementById('prayer-strip');
  if(!strip) return;
  strip.replaceChildren();
  for(const prayer of PRAYERS){
    const card = document.createElement('div'); card.className = 'prayer-card';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = prayerName(prayer);
    const time = document.createElement('span'); time.className = 'time'; time.textContent = fmt12(prayer.h, prayer.mi);
    card.append(name, time); strip.appendChild(card);
  }
}

// Umm al-Qura: Fajr at 18.5°, Maghrib at sunset, Isha 90 min after Maghrib (120 in Ramadan),
// Asr at shadow factor 1. Same method as Aladhan's method 4, so the offline times match to a minute or two.
function computePrayers(){
  const p = riyadhParts(), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - Date.now()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(18.5, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = maghrib + (hijriMonthNow() === 9 ? 120 : 90)/60;
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

// The sound scheduler and visible cards use the same mosque's beginning-of-prayer table.
const MIA_BUNDLED = __MIA_TIMETABLE__;
let MIA_DAYS = (()=>{ try { return {...MIA_BUNDLED, ...JSON.parse(localStorage.getItem('miaDays') || '{}')}; } catch(e) { return MIA_BUNDLED; } })();
function flattenMia(value, result = {}) {
  if(Array.isArray(value)) value.forEach(v => flattenMia(v, result));
  else if(value?.d_date && value?.fajr_begins && value?.isha_begins) result[value.d_date] = value;
  return result;
}
function miaToday(){
  const p = riyadhParts();
  const date = `${p.y}-${pad(p.mo)}-${pad(p.d)}`;
  const t = MIA_DAYS[date];
  if(!t) return null;
  return {Fajr:t.fajr_begins, Sunrise:t.sunrise, Dhuhr:t.zuhr_begins,
    Asr:CONFIG.asrMithl === 1 ? t.asr_mithl_1 : t.asr_mithl_2,
    Maghrib:t.maghrib_begins, Isha:t.isha_begins};
}
async function loadPrayers(){
  let times = miaToday();
  try {
    let last = 0; try { last = +localStorage.getItem('miaFetchedAt'); } catch(e){}
    if(!times || Date.now() - last > 6*3600*1000){
      const r = await fetchT('https://miaonline.org/wp-json/dpt/v1/prayertime?filter=year', 12000);
      if(!r.ok) throw 0;
      const days = flattenMia(await r.json());
      if(Object.keys(days).length){
        MIA_DAYS = {...MIA_DAYS, ...days};
        try { localStorage.setItem('miaDays',JSON.stringify(MIA_DAYS)); localStorage.setItem('miaFetchedAt',String(Date.now())); } catch(e){}
      }
      times = miaToday();
    }
  }catch(e){}
  // No fabricated alarm times: the native scheduler uses only valid, date-matched MIA rows.
  // The existing astronomical estimate remains a display fallback if a future year is unavailable.
  try { buildPrayers(times || computePrayers()); } catch(e){}
  tickPrayer(); tickRamadan();
  if(CONFIG.panel === 'prayers') renderPanel(false);
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

function tickPrayer(){
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;
  const nextIndex = PRAYERS.findIndex(x => (x.h*60+x.mi) > mins);
  document.querySelectorAll('#prayer-strip .prayer-card').forEach((card, i) =>
    card.classList.toggle('next', i === (nextIndex < 0 ? 0 : nextIndex)));

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    panel.classList.add('now');
    elL.textContent = 'حان الآن';
    elN.textContent = prayerName(cur);
    elT.textContent = fmt12(cur.h, cur.mi);
    elC.innerHTML = 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>';
    return;
  }

  panel.classList.remove('now');
  elL.textContent = 'الصلاة القادمة';
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  elN.textContent = prayerName(next);
  elT.textContent = fmt12(next.h, next.mi);
  elC.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>';
}

let RAM_CACHE = {day:'', val:null};
function ramadanStart(){
  const dayKey = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(RAM_CACHE.day === dayKey) return RAM_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'});
  let found = null;
  for(let i=0;i<400;i++){
    const d = new Date(Date.now()+i*86400000);
    if(fmt.format(d) === '9'){
      const p = riyadhParts(d);
      const hy = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
        .format(d).replace(/[^0-9]/g,'');
      found = {y:p.y, mo:p.mo, d:p.d, hy};
      break;
    }
  }
  RAM_CACHE = {day: dayKey, val: found};
  return found;
}
function hijriYearNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 1448; }
}
function hijriMonthNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 0; }
}
function tickRamadan(){
  const elL=document.getElementById('ramadan-label'),
        elD=document.getElementById('ramadan-days'),
        elS=document.getElementById('ramadan-sub');

  // ---- Ramadan mode: iftar / suhoor instead of the countdown ----
  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = riyadhParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = 'الإمساك'; targetM = fajrM; }
    else if(mins < maghribM){ label = 'الإفطار'; targetM = maghribM; }
    else { label = 'الإمساك'; targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    elL.textContent = label;
    elD.innerHTML = ar(th%12===0?12:th%12) + ':' + ar(String(tm).padStart(2,'0'))
                  + ' <span class="unit">' + (th < 12 ? 'ص' : 'م') + '</span>';
    elS.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>';
    return;
  }

  // ---- countdown mode ----
  const st = ramadanStart();
  elL.textContent = 'رمضان ' + ar(st ? st.hy : hijriYearNow());
  if(!st){ elD.textContent='—'; elS.textContent=''; return; }
  const rp2 = riyadhParts();
  const days = Math.max(0, Math.round(
    (Date.UTC(st.y, st.mo-1, st.d) - Date.UTC(rp2.y, rp2.mo-1, rp2.d)) / 86400000));
  elD.innerHTML = ar(days) + ' <span class="unit">يوم</span>';
  elS.textContent = days === 0 ? 'رمضان مبارك'
    : 'يبدأ ' + new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'})
        .format(new Date(Date.UTC(st.y, st.mo-1, st.d, 12)));
}

async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  try{ return await fetch(url,{cache:'no-store', signal:c.signal}); }
  finally{ clearTimeout(id); }
}
const SKIP_TYPES = ['News','Talk Show','Sports','Game Show'];
let NET_OK = 0;   // answers received; a refresh that got none must not replace what is on screen
async function getJSON(url, fallback){
  try{ const r = await fetchT(url, 12000); if(!r.ok) return fallback; const j = await r.json(); NET_OK++; return j; }
  catch(e){ return fallback; }
}
async function loadWeek(){
  const F = CONFIG.shows, seen = new Set(), out = [], answered = NET_OK;
  const days = [];
  for(let i=0;i<7;i++) days.push(new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)} · ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  const picked = await Promise.all(F.ids.map(id => getJSON(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`, null)));
  picked.forEach(s => {
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  });

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = await Promise.all(days.flatMap(dt => [
      getJSON(`https://api.tvmaze.com/schedule/web?date=${dt}`, []),
      ...F.countries.map(c => getJSON(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`, []))
    ]));
    lists.flat().forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;   // no daytime soaps
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;               // keep it to real series
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  // nothing answered (offline): keep the saved list if one is shown
  if(NET_OK === answered && document.querySelector('#week-list li:not(.empty)')) return;
  if(out.length){                                   // keep the last good list on a failed refresh
    WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
    WEEK_PAGE = 0;
  }
  renderWeekPage(false);
}

const WEEK_ROWS = 5;
let WEEK_POOL = [];
let WEEK_PAGE = 0;

function renderWeekPage(animate){
  const ul = document.getElementById('week-list');
  if(!WEEK_POOL.length){
    ul.classList.remove('flip');
    ul.innerHTML = '<li class="empty">لا جديد هذا الأسبوع</li>';
    return;
  }
  const start = (WEEK_PAGE * WEEK_ROWS) % WEEK_POOL.length;
  const rows = [];
  for(let i = 0; i < Math.min(WEEK_ROWS, WEEK_POOL.length); i++){
    rows.push(WEEK_POOL[(start + i) % WEEK_POOL.length]);
  }
  ul.innerHTML = rows.map(o=>{
    const dt = o.date ? new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date(o.date+'T12:00:00Z')) : '';
    return `<li><span>${esc(o.name)}</span>`
         + (o.ep?`<span class="ep">${ar(o.ep)}</span>`:'')
         + (o.rating ? `<span class="rt">${ar(o.rating.toFixed(1)).replace('.','٫')}</span>` : '')
         + (dt?`<span class="dt">${dt}</span>`:'') + '</li>';
  }).join('');
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

function prayerRows(){

  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;

  });
}

// Environment and Climate Change Canada, Winnipeg (The Forks) city forecast icon codes.
const ECCC_CODES = {0:'مشمس',1:'مشمس غالباً',2:'غائم جزئياً',3:'غائم جزئياً',
  10:'غائم',11:'أمطار',12:'زخات مطر',13:'زخات مطر',14:'ثلوج',15:'زخات ثلج',
  16:'أمطار وثلوج',17:'رعد',18:'أمطار متجمدة',19:'برد',20:'ضباب',
  21:'رذاذ',22:'ثلج',23:'ثلج',24:'مطر',25:'مطر',26:'مطر',27:'ثلج',28:'ثلج',
  29:'عواصف رعدية',30:'صافي',31:'صافي غالباً',32:'غائم جزئياً',33:'غائم جزئياً',34:'غائم'};
const OPEN_METEO_CODES = {0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'};
function ecccForecast(properties){
  const periods = properties.forecastGroup?.forecasts || [];
  const stamp = properties.forecastGroup?.timestamp?.en || properties.lastUpdated;
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Winnipeg',year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(new Date(stamp)).reduce((o, p) => (o[p.type] = p.value, o), {});
  const local = `${parts.year}-${parts.month}-${parts.day}`;
  const date = new Date(local + 'T12:00:00Z');
  const rows = [];
  for(const period of periods){
    const name = period.period?.value?.en || '';
    const night = /night|tonight/i.test(name);
    const value = period.temperatures?.temperature?.[0]?.value?.en;
    if(night){
      if(rows.length && rows[rows.length-1].lo == null) rows[rows.length-1].lo = value ?? null;
      date.setUTCDate(date.getUTCDate() + 1);
    }else{
      if(rows.length && rows[rows.length-1].date === date.toISOString().slice(0,10)) continue;
      rows.push({date:date.toISOString().slice(0,10),code:period.abbreviatedForecast?.icon?.value,
        hi:value ?? null,lo:null});
    }
  }
  return rows.filter(x => x.hi != null).slice(0,7);
}

      const j = await r.json(), daily = j.daily || {};
      document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
      document.getElementById('wx-desc').textContent = OPEN_METEO_CODES[j.current.weather_code] || '';
      FORECAST = (daily.time || []).map((date, i) => ({date,
        desc:OPEN_METEO_CODES[daily.weather_code?.[i]] || '',
        hi:daily.temperature_2m_max?.[i],lo:daily.temperature_2m_min?.[i]}))
        .filter(x => x.hi != null);
      const hi = FORECAST[0]?.hi, lo = FORECAST[0]?.lo;
      document.getElementById('wx-range').textContent = hi != null && lo != null
        ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
      try{ localStorage.setItem('forecast:' + location.hash, JSON.stringify(FORECAST)); }catch(e){}
      if(CONFIG.panel === 'forecast') renderPanel(false);
    }catch(e){}
    return;
  }
  try{
    const r = await fetchT('https://api.weather.gc.ca/collections/citypageweather-realtime/items/mb-36?f=json', 12000);
    if(!r.ok) throw 0;
    const j = (await r.json()).properties;
    const current = j.currentConditions || {};
    const temperature = current.temperature?.value?.en;
    if(temperature == null) throw 0;
    document.getElementById('wx-temp').textContent = ar(Math.round(temperature)) + '°';
    const d = document.getElementById('wx-desc');
    const hourly = j.hourlyForecastGroup?.hourlyForecasts?.[0];
    d.textContent = ECCC_CODES[current.iconCode?.value ?? hourly?.iconCode?.value] || '';
    d.classList.remove('dust');
    FORECAST = ecccForecast(j);
    const hi = FORECAST[0]?.hi, lo = FORECAST[0]?.lo;
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    try{ localStorage.setItem('forecast:' + location.hash, JSON.stringify(FORECAST)); }catch(e){}
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return; }   // keep the last reading; with none only the city shows
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  const p = riyadhParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  if(el) el.style.opacity = Math.max(0, Math.min(MAX, o)).toFixed(2);
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
}

// Background photos: the hosted set in photos/ (photos/index.json in the repo). A hosted photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/MoSbeaa/MuslimTV/main/photos/';
let REMOTE_BGS = (()=>{ try{ return JSON.parse(localStorage.getItem('photoIndex') || '[]'); }catch(e){ return []; } })();

async function loadPhotoIndex(){
  try{
    const r = await fetchT(PHOTO_BASE + 'index.json', 15000);
    if(!r.ok) return;
    const list = (await r.json()).filter(p => p && p.f);
    if(list.length){
      REMOTE_BGS = list;
      try{ localStorage.setItem('photoIndex', JSON.stringify(list)); }catch(e){}
    }
  }catch(e){}
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

let CURRENT_BG_URL = '', BG_PENDING = null, BG_FADING = false;
let BG_ACTIVE = document.querySelector('.photo.current');
let BG_HIDDEN = document.querySelector('.photo:not(.current)');
function paintBackground(layer, url, b){
  if(!layer) return;
  layer.style.backgroundImage = "url('" + url + "')";
  layer.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? 'الصورة: ' + b.c : '';
}
function fadeToPendingBackground(){
  if(!BG_PENDING || BG_FADING) return;
  if(!BG_ACTIVE || !BG_HIDDEN) return;
  BG_FADING = true;
  const outgoing = BG_ACTIVE, incoming = BG_HIDDEN;
  outgoing.classList.remove('current');
  setTimeout(() => {
    const next = BG_PENDING; BG_PENDING = null;
    if(next && next.url !== CURRENT_BG_URL){
      paintBackground(incoming, next.url, next.b);
      CURRENT_BG_URL = next.url;
      BG_ACTIVE = incoming; BG_HIDDEN = outgoing;
      requestAnimationFrame(() => requestAnimationFrame(() => incoming.classList.add('current')));
    }else outgoing.classList.add('current');
    setTimeout(() => {
      BG_FADING = false;
      if(BG_PENDING && BG_PENDING.url !== CURRENT_BG_URL) fadeToPendingBackground();
      else BG_PENDING = null;
    }, 1250);
  }, 1250);
}
function showBackground(url, b){
  reveal();
  if(BG_FADING){ BG_PENDING = {url, b}; return; }
  if(url === CURRENT_BG_URL) return;
  if(!CURRENT_BG_URL){ paintBackground(BG_ACTIVE, url, b); CURRENT_BG_URL = url; return; }
  BG_PENDING = {url, b};
  fadeToPendingBackground();
}

// Every 4 days a new random set of 5 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every CONFIG.photoMinutes (30 unless the owner changed it). Only the photo on screen is downloaded.
const PHOTO_SET = 5, PHOTO_PERIOD_DAYS = 4;
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function tickCountdown(){
  const panel = document.querySelector('.p-countdown');
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(CONFIG.eventDate);
  const target = match ? Date.UTC(+match[1], +match[2] - 1, +match[3]) : NaN;
  const valid = match && new Date(target).toISOString().slice(0,10) === CONFIG.eventDate;
  if(panel) panel.hidden = !valid;
  if(!valid) return;
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone, year:'numeric', month:'2-digit', day:'2-digit'})
    .formatToParts(new Date()).reduce((o, x) => (o[x.type] = +x.value, o), {});
  const today = Date.UTC(parts.year, parts.month - 1, parts.day);
  const remaining = Math.round((target - today) / 86400000);
  document.getElementById('countdown-label').textContent = CONFIG.eventTitle;
  document.getElementById('countdown-days').textContent = ar(Math.max(0, remaining));
  document.getElementById('countdown-sub').textContent = remaining < 0 ? 'انقضى الموعد' : remaining === 0 ? 'الموعد اليوم' : 'متبقٍ حتى ' + ar(CONFIG.eventDate);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
let BG_SLOT = -1;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slotMin = CONFIG.photoMinutes;   // divides 1440, so slots count on across midnight
    const slot = riyadhDayNumber() * (1440 / slotMin) + Math.floor((p.h * 60 + p.mi) / slotMin);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const set = REMOTE_BGS.length ? (REMOTE_BGS.every(b => b.f.startsWith("tv/")) ? REMOTE_BGS : photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k])) : [];
    const local = BGS[slot % BGS.length];
    if(!set.length){ showBackground(local.u, local); return; }
    const b = set[slot % set.length], url = PHOTO_BASE + b.f;
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // The next image is loaded only when needed. Loading the entire personal collection at once
    // can exhaust this Fire TV Stick's WebView memory and briefly blank its photo layer.
  } catch(e) {}
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = 'snap4:' + location.hash;   // bump when the panels' markup changes
const SNAP_SEL = ['.weather', '#week-list', '.p-countdown'];
function saveSnap(){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(SNAP_SEL.map(q => (document.querySelector(q)||{}).innerHTML || ''))); }catch(e){}
}
function restoreSnap(){
  try{
    const v = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if(v) SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[i]) el.innerHTML = v[i]; });
  }catch(e){}
}

function boot(){
  if(CONFIG.widget){ bootWidget(); return; }
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  if(cs) cs.textContent = 'بتوقيت ' + CONFIG.city;
  document.title = 'MuslimTV Screensaver';
  if(REMOTE_BGS.length) applyBackground(true);
  const firstPhotoFallback = REMOTE_BGS.length ? null : setTimeout(() => applyBackground(true), 1200);
  loadPhotoIndex().then(() => { if(firstPhotoFallback) clearTimeout(firstPhotoFallback); applyBackground(true); });
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan(); tickCountdown();
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else if(CONFIG.panel !== 'shows') renderPanel(false);   // panel data arrives with prayers or weather
  loadPrayers(); if(CONFIG.panel === 'shows') loadWeek(); loadWeather();
  applyNight(); pixelShift();

  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(tickCountdown, 60000);
  setInterval(loadPrayers, 6*3600*1000);
  if(CONFIG.panel === 'shows') setInterval(loadWeek, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(CONFIG.panel === 'shows' && WEEK_POOL.length > WEEK_ROWS){ WEEK_PAGE++; renderWeekPage(true); }
  }, 25*1000);
  setInterval(applyNight, 60*1000);
  setInterval(pixelShift, 4*60*1000);
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); tickCountdown(); loadPrayers(); if(CONFIG.panel === 'shows') loadWeek(); loadWeather(); renderPanel(false); }
  }, 60*1000);
}

// The launcher's card: the chosen panel only, refreshed like on the screensaver, nothing else loaded.
function bootWidget(){
  document.documentElement.classList.add('widget');
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const P = CONFIG.panel;
  if(P === 'shows'){ loadWeek(); setInterval(loadWeek, 6*3600*1000); }
  else renderPanel(false);
  if(P === 'prayers'){ loadPrayers(); setInterval(loadPrayers, 6*3600*1000); setInterval(() => renderPanel(false), 15000); }
  if(P === 'forecast'){ loadWeather(); setInterval(loadWeather, 30*60*1000); }
  setInterval(() => {
    if(P === 'shows' && WEEK_POOL.length > WEEK_ROWS){ WEEK_PAGE++; renderWeekPage(true); }
  }, 25*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(P === 'prayers') loadPrayers(); renderPanel(false); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
